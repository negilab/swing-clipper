<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0F1115">
<title>JWW ビューア</title>
<style>
:root{
  --ink:#0F1115; --panel:#171A20; --panel2:#1D212A; --rule:#2A3038;
  --fg:#E7EBF2; --dim:#828D9E; --faint:#59636F;
  --blue:#3E8BE0; --blue-dim:#20344B;
  --paper:#FFFFFF; --paper-dark:#0B0D10;
  --ui:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,"Roboto Mono",monospace;
  --bar:46px; --rail:212px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  position:fixed;inset:0;height:100vh;height:100dvh;
  background:var(--ink);color:var(--fg);font-family:var(--ui);
  font-size:13px;line-height:1.5;
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- top bar ---------- */
.bar{
  height:var(--bar);flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:0 10px;background:var(--panel);border-bottom:1px solid var(--rule);
}
.mark{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.mark svg{display:block}
.mark b{font-size:12px;font-weight:650;letter-spacing:.14em}
.fname{
  flex:1 1 auto;min-width:0;font-family:var(--mono);font-size:11.5px;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.btn{
  height:30px;padding:0 11px;border:1px solid var(--rule);border-radius:6px;
  background:var(--panel2);color:var(--fg);font-size:12px;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;transition:border-color .12s,background .12s;
}
.btn:hover{border-color:#3B434F}
.btn:active{background:#232833}
.btn.on{border-color:var(--blue);background:var(--blue-dim);color:#BFDCFB}
.btn.pri{border-color:var(--blue);background:var(--blue);color:#06121F;font-weight:600}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn[disabled]{opacity:.38;pointer-events:none}

/* ---------- body ---------- */
.wrap{flex:1 1 auto;display:flex;min-height:0;position:relative}
.stage{flex:1 1 auto;position:relative;min-width:0;background:var(--ink)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- rail ---------- */
.rail{
  flex:0 0 var(--rail);width:var(--rail);background:var(--panel);
  border-right:1px solid var(--rule);overflow-y:auto;overscroll-behavior:contain;
  padding:12px 12px 20px;
}
.rail h3{
  margin:0 0 8px;font-size:10px;font-weight:650;letter-spacing:.16em;color:var(--faint);
  text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline;gap:6px;
}
.rail h3 span{font-family:var(--mono);letter-spacing:0;text-transform:none;color:var(--faint)}
.sect+.sect{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}

/* Jw_cad style 4x4 layer pad — the signature element */
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.cell{
  aspect-ratio:1/1;border:1px solid var(--rule);border-radius:4px;background:#12151B;
  font-family:var(--mono);font-size:11px;color:var(--faint);
  display:flex;align-items:center;justify-content:center;position:relative;
  transition:background .1s,border-color .1s,color .1s;
}
.cell.has{color:var(--dim);background:#1A1F27}
.cell.vis{color:#CFE3FA;background:var(--blue-dim);border-color:#33536F}
.cell.sel{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.cell.empty{opacity:.3;cursor:default}
.cell.off::after{content:'';position:absolute;right:2px;top:2px;width:4px;height:4px;border-radius:50%;background:#6E4A2A}
.cell:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.padname{
  margin-top:8px;font-size:11.5px;color:var(--dim);min-height:1.5em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.padname b{color:var(--fg);font-weight:500}
.row{display:flex;gap:6px;margin-top:8px}
.row .btn{height:26px;padding:0 8px;font-size:11px;flex:1 1 0;justify-content:center}
.opt{display:flex;flex-direction:column;gap:6px}
.opt label{
  display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--dim);font-size:12px;
  padding:3px 0;
}
.opt input{accent-color:var(--blue);width:15px;height:15px;margin:0;flex:0 0 auto}
.opt label:hover{color:var(--fg)}
dl.meta{margin:0;font-size:11.5px;display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
dl.meta dt{color:var(--faint)}
dl.meta dd{margin:0;font-family:var(--mono);color:var(--dim);text-align:right}

/* ---------- status strip (scale-rule motif) ---------- */
.status{
  flex:0 0 auto;height:26px;display:flex;align-items:center;gap:0;
  background:var(--panel);border-top:1px solid var(--rule);
  font-family:var(--mono);font-size:11px;color:var(--dim);overflow:hidden;
}
.status .f{padding:0 10px;border-right:1px solid var(--rule);white-space:nowrap;flex:0 0 auto}
.status .f i{color:var(--faint);font-style:normal}
.status .tick{
  flex:1 1 auto;height:100%;min-width:0;
  background-image:repeating-linear-gradient(90deg,var(--rule) 0 1px,transparent 1px 12px);
  background-position:left bottom;background-size:auto 6px;background-repeat:repeat-x;
}

/* ---------- drop / empty state ---------- */
.drop{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:18px;text-align:center;padding:24px;
  background:var(--ink);z-index:5;
}
.drop.hide{display:none}
.drop .sheet{
  width:min(420px,100%);border:1px dashed #333B47;border-radius:12px;padding:32px 24px;
  background:linear-gradient(#14171D,#101319);
}
.drop.over .sheet{border-color:var(--blue);background:linear-gradient(#16202C,#101319)}
.drop h1{margin:0 0 6px;font-size:17px;font-weight:600;letter-spacing:.01em}
.drop p{margin:0 0 20px;color:var(--dim);font-size:12.5px}
.drop .note{margin:0;color:var(--faint);font-size:11.5px;line-height:1.7}
.drop .note code{font-family:var(--mono);color:var(--dim)}

.busy{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(15,17,21,.86);z-index:6;font-size:12.5px;color:var(--dim);
}
.busy.on{display:flex}
.err{
  position:absolute;left:12px;right:12px;bottom:12px;z-index:7;
  background:#2A1A1C;border:1px solid #5B3036;border-radius:8px;padding:10px 12px;
  font-size:12px;color:#F0C9CC;display:none;
}
.err.on{display:block}

/* ---------- mobile ---------- */
.railToggle{display:none}
.scrim{display:none}
@media (max-width:760px){
  .fname{display:none}
  .railToggle{display:inline-flex}
  .rail{
    position:absolute;left:0;right:0;bottom:0;top:auto;width:auto;flex-basis:auto;
    max-height:70%;border-right:0;border-top:1px solid var(--rule);
    border-radius:14px 14px 0 0;z-index:9;transform:translateY(101%);
    transition:transform .22s cubic-bezier(.3,.8,.3,1);
    padding-bottom:calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 -18px 40px rgba(0,0,0,.5);
  }
  .rail.open{transform:translateY(0)}
  .rail::before{
    content:'';display:block;width:34px;height:3px;border-radius:2px;background:var(--rule);
    margin:-4px auto 12px;
  }
  .scrim{
    display:block;position:absolute;inset:0;background:rgba(8,10,13,.5);z-index:8;
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .scrim.on{opacity:1;pointer-events:auto}
  .status .f.hideSm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="bar">
  <div class="mark">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
      <rect x="1.5" y="1.5" width="15" height="15" rx="1.5" stroke="#3E8BE0" stroke-width="1.2"/>
      <path d="M1.5 12.5h15M12.5 1.5v15" stroke="#3E8BE0" stroke-width="1.2" opacity=".55"/>
      <circle cx="6.6" cy="7.4" r="2.6" stroke="#E7EBF2" stroke-width="1.2"/>
    </svg>
    <b>JWW</b>
  </div>
  <div class="fname" id="fname"></div>
  <button class="btn railToggle" id="railToggle">レイヤ</button>
  <button class="btn" id="btnFit" disabled>全体</button>
  <button class="btn pri" id="btnOpen">開く</button>
  <input type="file" id="file" accept=".jww,.JWW" hidden>
</div>

<div class="wrap">
  <aside class="rail" id="rail">
    <div class="sect">
      <h3>レイヤグループ <span id="grpTag">—</span></h3>
      <div class="pad" id="padG"></div>
      <div class="padname" id="grpName"></div>
      <div class="row">
        <button class="btn" data-all="g1">全表示</button>
        <button class="btn" data-all="g0">全非表示</button>
      </div>
    </div>

    <div class="sect">
      <h3>レイヤ <span id="layTag">—</span></h3>
      <div class="pad" id="padL"></div>
      <div class="padname" id="layName"></div>
      <div class="row">
        <button class="btn" data-all="l1">全表示</button>
        <button class="btn" data-all="l0">全非表示</button>
      </div>
    </div>

    <div class="sect">
      <h3>表示</h3>
      <div class="opt">
        <label><input type="checkbox" id="optText" checked>文字を描く</label>
        <label><input type="checkbox" id="optColor" checked>線色を反映する</label>
        <label><input type="checkbox" id="optWidth">線幅を反映する</label>
        <label><input type="checkbox" id="optDark">背景を黒にする</label>
      </div>
      <div class="row">
        <button class="btn" id="btnPng">PNG で保存</button>
      </div>
    </div>

    <div class="sect">
      <h3>図面情報</h3>
      <dl class="meta" id="meta"></dl>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>

    <div class="drop" id="drop">
      <div class="sheet">
        <h1>JWW ファイルを開く</h1>
        <p>Jw_cad の図面を、そのままブラウザで見られます。</p>
        <button class="btn pri" id="btnOpen2">ファイルを選ぶ</button>
        <p class="note" style="margin-top:20px">
          ここへドラッグ＆ドロップでも開きます。<br>
          読み込みはすべて端末の中で行われ、<br>図面はどこにも送信されません。
        </p>
      </div>
    </div>

    <div class="busy" id="busy">読み込んでいます…</div>
    <div class="err" id="err"></div>
  </div>
</div>

<div class="status">
  <div class="f"><i>X</i> <span id="sx">—</span></div>
  <div class="f"><i>Y</i> <span id="sy">—</span></div>
  <div class="f hideSm"><i>縮尺</i> <span id="ss">—</span></div>
  <div class="f"><i>表示</i> <span id="sz">—</span></div>
  <div class="tick"></div>
  <div class="f hideSm"><span id="sn">—</span></div>
</div>

<script>
/* ============================================================
   JWW (Jw_cad) parser  —  pure JavaScript, no DOM dependencies
   MFC CArchive serialised format, schema 700 (Jw_cad 7.x)
   ============================================================ */
(function (root) {
  'use strict';

  var SJIS = null;
  function decodeSJIS(bytes) {
    if (SJIS === null) {
      var labels = ['shift_jis', 'shift-jis', 'sjis', 'windows-31j'];
      for (var i = 0; i < labels.length; i++) {
        try { SJIS = new TextDecoder(labels[i]); break; } catch (e) { /* next */ }
      }
      if (SJIS === null) SJIS = false;
    }
    if (SJIS === false) {
      var s = '';
      for (var j = 0; j < bytes.length; j++) s += String.fromCharCode(bytes[j]);
      return s;
    }
    return SJIS.decode(bytes);
  }

  /* ---------- little-endian cursor ---------- */
  function Reader(dv, u8, pos) {
    this.dv = dv; this.u8 = u8; this.p = pos || 0;
  }
  Reader.prototype = {
    u8v:  function () { return this.u8[this.p++]; },
    u16v: function () { var v = this.dv.getUint16(this.p, true); this.p += 2; return v; },
    u32v: function () { var v = this.dv.getUint32(this.p, true); this.p += 4; return v; },
    i32v: function () { var v = this.dv.getInt32(this.p, true); this.p += 4; return v; },
    f64v: function () { var v = this.dv.getFloat64(this.p, true); this.p += 8; return v; },
    f64n: function (n) { var a = new Array(n); for (var i = 0; i < n; i++) a[i] = this.f64v(); return a; },
    bytes: function (n) { var b = this.u8.subarray(this.p, this.p + n); this.p += n; return b; },
    // MFC CString: BYTE len, or 0xFF + WORD, or 0xFF + 0xFFFF + DWORD
    str: function () {
      var n = this.u8v();
      if (n === 0xFF) { n = this.u16v(); if (n === 0xFFFF) n = this.u32v(); }
      return decodeSJIS(this.bytes(n));
    }
  };

  /* ---------- common 15-byte element header ----------
     u32 reserved | u8 lineType | u16 color | u16 width
     u16 group    | u16 layer   | u16 flags                     */
  function head(r) {
    return {
      _z:  r.u32v(),
      typ: r.u8v(),
      col: r.u16v(),
      wid: r.u16v(),
      grp: r.u16v(),
      lay: r.u16v(),
      flg: r.u16v()
    };
  }

  function rdSen(r)  { var h = head(r); h.k = 'line';  h.v = r.f64n(4); return h; }
  function rdEnko(r) { var h = head(r); h.k = 'arc';   h.v = r.f64n(7); h.n = r.u32v(); return h; }
  function rdTen(r)  { var h = head(r); h.k = 'point'; h.v = r.f64n(2); h.n = r.u32v(); return h; }
  function rdSolid(r){ var h = head(r); h.k = 'solid'; h.v = r.f64n(8); h.rgb = r.u32v(); return h; }
  function rdBlock(r){ var h = head(r); h.k = 'block'; h.v = r.f64n(5); h.no = r.u32v(); return h; }
  function rdMoji(r) {
    var h = head(r); h.k = 'text';
    h.v = r.f64n(4);          // baseline start / end
    h.n = r.u32v();           // font code
    h.q = r.f64n(4);          // char width, height, spacing, angle(deg)
    h.font = r.str();
    h.txt  = r.str();
    return h;
  }
  // dimension = header + line + text + WORD + 2 lines + 4 points
  function rdSunpou(r) {
    var h = head(r); h.k = 'dim';
    h.line = rdSen(r);
    h.moji = rdMoji(r);
    r.u16v();
    h.aux = [rdSen(r), rdSen(r)];
    h.pts = [rdTen(r), rdTen(r), rdTen(r), rdTen(r)];
    return h;
  }

  var READERS = {
    CDataSen: rdSen, CDataEnko: rdEnko, CDataMoji: rdMoji, CDataTen: rdTen,
    CDataSolid: rdSolid, CDataBlock: rdBlock, CDataSunpou: rdSunpou
  };

  /* ---------- locate the object stream ----------
     Find the first MFC "new class" record naming a CData* class.
     The element count sits immediately before it.                */
  function findStream(u8, dv) {
    var lim = Math.min(u8.length - 40, 4 * 1024 * 1024);
    for (var i = 8; i < lim; i++) {
      if (u8[i] !== 0xFF || u8[i + 1] !== 0xFF) continue;
      var len = dv.getUint16(i + 4, true);
      if (len < 6 || len > 40) continue;
      if (u8[i + 6] !== 0x43 || u8[i + 7] !== 0x44) continue;      // "CD"
      var nm = '';
      for (var k = 0; k < len; k++) nm += String.fromCharCode(u8[i + 6 + k]);
      if (nm.indexOf('CData') !== 0) continue;
      // element count precedes the tag
      if (i >= 6 && dv.getUint16(i - 6, true) === 0xFFFF) {
        return { at: i, count: dv.getUint32(i - 4, true) };
      }
      return { at: i, count: dv.getUint16(i - 2, true) };
    }
    return null;
  }

  /* ---------- header: version, memo, scale, layer names ---------- */
  function readHeader(dv, u8, streamAt) {
    var out = { version: 0, memo: '', scale: 0, names: null, gscale: null, lstate: null };
    var r = new Reader(dv, u8, 8);
    out.version = r.u32v();
    try { out.memo = r.str(); } catch (e) { /* ignore */ }
    var afterMemo = r.p;
    try { out.scale = dv.getFloat64(afterMemo + 16, true); } catch (e) { /* ignore */ }

    /* 16 layer-group blocks, 148 bytes each:
       +0   double  group scale (1/N)
       +12  16 x (u32 layer state, u32 unused)
       state: 0=hidden, 1=view only, 2=editable, 3=write layer            */
    try {
      var base = afterMemo + 16, ok = true;
      var gscale = [], lstate = [];
      for (var g = 0; g < 16 && ok; g++){
        var bb = base + 148 * g;
        if (bb + 148 > streamAt) { ok = false; break; }
        var sc = dv.getFloat64(bb, true);
        if (!(sc > 0) || !isFinite(sc) || sc > 1e7) { ok = false; break; }
        gscale.push(sc);
        var row = [];
        for (var l = 0; l < 16; l++){
          var st = dv.getUint32(bb + 12 + 8*l, true);
          if (st > 3) { ok = false; break; }
          row.push(st);
        }
        lstate.push(row);
      }
      if (ok && gscale.length === 16){ out.gscale = gscale; out.lstate = lstate; }
    } catch (e) { /* leave unset */ }

    // 16 groups x (16 layer names + 1 group name), Shift-JIS CStrings.
    // The settings block ahead of them is fixed-size per version, so probe.
    for (var off = afterMemo + 2200; off < afterMemo + 3200 && off < streamAt; off++) {
      var p = off, names = [], ok = true, filled = 0;
      for (var i = 0; i < 272; i++) {
        if (p >= streamAt) { ok = false; break; }
        var n = u8[p];
        if (n > 40) { ok = false; break; }
        var b = u8.subarray(p + 1, p + 1 + n); p += 1 + n;
        var bad = false;
        for (var j = 0; j < b.length; j++) if (b[j] < 0x20 && b[j] !== 0) { bad = true; break; }
        if (bad) { ok = false; break; }
        var s = n ? decodeSJIS(b) : '';
        if (s.indexOf('\uFFFD') >= 0) { ok = false; break; }
        if (s.trim()) filled++;
        names.push(s);
      }
      if (ok && filled >= 24) { out.names = names; break; }
    }
    return out;
  }

  /* ---------- main entry ---------- */
  function parse(buffer) {
    var u8 = new Uint8Array(buffer), dv = new DataView(buffer);
    var sig = '';
    for (var i = 0; i < 8; i++) sig += String.fromCharCode(u8[i]);
    if (sig !== 'JwwData.') throw new Error('JWWファイルではないようです（先頭の識別子が違います）');

    var s = findStream(u8, dv);
    if (!s) throw new Error('図形データの開始位置が見つかりませんでした');

    var meta = readHeader(dv, u8, s.at);
    var r = new Reader(dv, u8, s.at);
    var arr = {}, next = 1;

    function tagOK(p) {
      if (p + 2 > u8.length) return false;
      var w = dv.getUint16(p, true);
      if (w === 0xFFFF) return true;
      if (w === 0x7FFF) {
        if (p + 6 > u8.length) return false;
        var ob = dv.getUint32(p + 2, true);
        return (ob & 0x80000000) !== 0 && arr[ob & 0x7FFFFFFF] !== undefined;
      }
      if (w & 0x8000) return arr[w & 0x7FFF] !== undefined;
      return false;
    }

    var out = [], counts = {}, warn = [], resync = 0;
    var end = u8.length;

    for (var idx = 0; idx < s.count; idx++) {
      try {
        var w = r.u16v();
        var ob = (w === 0x7FFF) ? r.u32v() : ((((w & 0x8000) << 16) | (w & 0x7FFF)) >>> 0);
        var name;
        if (ob === 0x80007FFF) {                    // new class definition
          r.u16v();                                 // schema
          var ln = r.u16v();
          name = decodeSJIS(r.bytes(ln));
          arr[next++] = name;
        } else if ((ob & 0x80000000) !== 0) {
          name = arr[ob & 0x7FFFFFFF];
        } else {
          throw new Error('object reference tag');
        }
        var fn = READERS[name];
        if (!fn) throw new Error('未対応の要素 ' + name);
        var o = fn(r);
        // some variants carry a 20-byte tail; resynchronise if needed
        if (idx < s.count - 1 && !tagOK(r.p)) {
          if (tagOK(r.p + 20)) { r.p += 20; resync++; }
          else throw new Error('データ位置がずれました');
        }
        arr[next++] = name;
        counts[o.k] = (counts[o.k] || 0) + 1;
        out.push(o);
        if (r.p >= end) break;
      } catch (e) {
        warn.push('要素 ' + (idx + 1) + '/' + s.count + ' で読み取りを終了しました（' + e.message + '）');
        break;
      }
    }

    return {
      version: meta.version, memo: meta.memo, scale: meta.scale,
      names: meta.names, gscale: meta.gscale, lstate: meta.lstate,
      declared: s.count, elements: out,
      counts: counts, warnings: warn, resync: resync
    };
  }

  var api = { parse: parse, decodeSJIS: decodeSJIS };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  root.JWW = api;
})(typeof self !== 'undefined' ? self : this);

</script>

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var HEX = '0123456789ABCDEF';

/* ---------- palettes ---------- */
var JW_COLORS = ['#000000','#000000','#1C4FD8','#0C8A3C','#00A0C0','#D42020','#9A34C0','#8A6A00','#7A8794','#8A94A2'];
var SXF_COLORS = ['#000000','#000000','#D42020','#0C8A3C','#1C4FD8','#C9A400','#B534B0','#00A0C0','#3A424E','#7A8794',
                  '#8A2020','#0C6A30','#203C8A','#7A6A20','#7A2070','#00707A','#9AA4B0'];
function penColor(c, dark){
  var hex;
  if (c >= 100) hex = SXF_COLORS[Math.min(c - 100, 16)] || '#000000';
  else hex = JW_COLORS[Math.min(c, 9)] || '#000000';
  if (dark && (hex === '#000000' || hex === '#000')) return '#E8ECF2';
  if (!dark && hex === '#FFFFFF') return '#000000';
  return hex;
}
/* Jw_cad line types 1-9, plus SXF (>=10) folded into the same family */
function dashOf(t){
  var base = t >= 10 ? ((t % 8) + 2) : t;
  switch(base){
    case 2:  return [3,2];
    case 3:  return [6,3];
    case 4:  return [10,4];
    case 5:  return [12,3,2,3];
    case 6:  return [18,4,3,4];
    case 7:  return [12,3,2,3,2,3];
    case 8:  return [18,4,3,4,3,4];
    case 9:  return [1,2];
    default: return null;
  }
}
function sweepEnd(st, en){
  if (!isFinite(st) || !isFinite(en)) return st + Math.PI*2;
  var e = en, guard = 0;
  while (e <= st && guard++ < 8) e += Math.PI*2;
  if (e - st > Math.PI*2 + 1e-9) e = st + Math.PI*2;
  return e;
}
function fontFamily(name){
  if (!name) return 'sans-serif';
  if (/明朝|Mincho|MS P?Mincho|serif/i.test(name)) return '"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif';
  return '"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif';
}

/* ---------- state ---------- */
var doc = null;                 // parsed file
var cells = null;               // cells[g*16+l] = bucket
var groupOn = [], layerOn = [], curG = 0;
var view = { s:1, tx:0, ty:0 }; // world -> screen
var bounds = null;
var opt = { text:true, color:true, width:false, dark:false };
var hiddenInFile = 0;
function layerCountRaw(g,l){ var b = cells[g*16+l]; return b ? b.n : 0; }

var fast = false, fastT = 0;
function touchNow(){ fast = true; clearTimeout(fastT); fastT = setTimeout(function(){ fast = false; draw(); }, 180); }
var cv = $('cv'), ctx = cv.getContext('2d', { alpha:false });
var dpr = 1, W = 0, H = 0, raf = 0;

/* ---------- sizing ---------- */
function resize(){
  var r = $('stage').getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  var nw = Math.max(1, Math.round(r.width)), nh = Math.max(1, Math.round(r.height));
  var grew = doc && (Math.abs(nw - W) > 2 || Math.abs(nh - H) > 2);
  W = nw; H = nh;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  if (grew && autoFit) fit(); else draw();
}
var autoFit = true;
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 260); });
if (window.ResizeObserver) new ResizeObserver(resize).observe($('stage'));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

/* ---------- load ---------- */
function showErr(m){ var e = $('err'); e.textContent = m; e.classList.add('on'); setTimeout(function(){ e.classList.remove('on'); }, 7000); }

function openFile(f){
  if (!f) return;
  $('busy').classList.add('on');
  $('fname').textContent = f.name;
  var fr = new FileReader();
  fr.onerror = function(){ $('busy').classList.remove('on'); showErr('ファイルを読めませんでした。'); };
  fr.onload = function(){
    setTimeout(function(){
      try { build(JWW.parse(fr.result), f); }
      catch(e){ showErr(e.message || String(e)); }
      $('busy').classList.remove('on');
    }, 16);
  };
  fr.readAsArrayBuffer(f);
}

function bucket(){ return { line:{}, arc:{}, solid:{}, text:[], point:[], n:0 }; }

function push(b, e){
  var key, a;
  if (e.k === 'line'){
    key = e.col + '|' + e.typ + '|' + e.wid;
    a = b.line[key] || (b.line[key] = { col:e.col, typ:e.typ, wid:e.wid, v:[] });
    a.v.push(e.v[0], e.v[1], e.v[2], e.v[3]);
  } else if (e.k === 'arc'){
    key = e.col + '|' + e.typ + '|' + e.wid;
    a = b.arc[key] || (b.arc[key] = { col:e.col, typ:e.typ, wid:e.wid, v:[] });
    // cx, cy, r, startAngle, endAngle, tilt, flatness
    a.v.push(e.v[0], e.v[1], e.v[2], e.v[3], e.v[4], e.v[5], e.v[6]);
  } else if (e.k === 'solid'){
    key = String(e.rgb);
    a = b.solid[key] || (b.solid[key] = { rgb:e.rgb, quad:[], disc:[] });
    if (e.typ >= 100) a.disc.push(e.v[0], e.v[1], e.v[2], e.v[3], e.v[4], e.v[5], e.v[6]);
    else a.quad.push(e.v[0], e.v[1], e.v[2], e.v[3], e.v[4], e.v[5], e.v[6], e.v[7]);
  } else if (e.k === 'text'){
    b.text.push(e);
  } else if (e.k === 'point'){
    b.point.push(e.v[0], e.v[1], e.col);
  }
  b.n++;
}

/* Bounds that ignore far-flung stray geometry: seed from percentiles,
   then re-include every element that touches the enlarged seed box.      */
function robustBounds(bx0, by0, bx1, by1){
  var n = bx0.length, i;
  if (!n) return { x0:-100, y0:-100, x1:100, y1:100, dropped:0 };
  var full = { x0:Infinity, y0:Infinity, x1:-Infinity, y1:-Infinity };
  for (i = 0; i < n; i++){
    if (bx0[i] < full.x0) full.x0 = bx0[i];
    if (by0[i] < full.y0) full.y0 = by0[i];
    if (bx1[i] > full.x1) full.x1 = bx1[i];
    if (by1[i] > full.y1) full.y1 = by1[i];
  }
  full.dropped = 0;
  if (n < 200) return full;
  function pc(a, p){
    var step = Math.max(1, Math.floor(a.length / 20000)), t = [];
    for (var j = 0; j < a.length; j += step) t.push(a[j]);
    var s = Float64Array.from(t); s.sort();
    return s[Math.max(0, Math.min(s.length - 1, Math.round(p * (s.length - 1))))];
  }
  var sx0 = pc(bx0, 0.005), sy0 = pc(by0, 0.005), sx1 = pc(bx1, 0.995), sy1 = pc(by1, 0.995);
  var mx = Math.max((sx1 - sx0) * 0.3, 1), my = Math.max((sy1 - sy0) * 0.3, 1);
  var qx0 = sx0 - mx, qy0 = sy0 - my, qx1 = sx1 + mx, qy1 = sy1 + my;
  var r = { x0:Infinity, y0:Infinity, x1:-Infinity, y1:-Infinity }, hit = 0;
  for (i = 0; i < n; i++){
    // containment, not overlap: one huge stray arc can straddle the seed box
    if (bx0[i] < qx0 || bx1[i] > qx1 || by0[i] < qy0 || by1[i] > qy1) continue;
    if (bx0[i] < r.x0) r.x0 = bx0[i];
    if (by0[i] < r.y0) r.y0 = by0[i];
    if (bx1[i] > r.x1) r.x1 = bx1[i];
    if (by1[i] > r.y1) r.y1 = by1[i];
    hit++;
  }
  if (hit < n * 0.5) return full;
  r.dropped = n - hit;
  r.full = full;
  return r;
}

function build(d, f){
  doc = d;
  cells = new Array(256);
  var BX0 = [], BY0 = [], BX1 = [], BY1 = [];
  var ex0 = 0, ey0 = 0, ex1 = 0, ey1 = 0;

  function bb(x,y){
    if (x < ex0) ex0 = x; if (x > ex1) ex1 = x;
    if (y < ey0) ey0 = y; if (y > ey1) ey1 = y;
  }
  function place(e){
    var g = e.grp & 15, l = e.lay & 15, i = g * 16 + l;
    var b = cells[i] || (cells[i] = bucket());
    push(b, e);
    var v = e.v, q;
    ex0 = Infinity; ey0 = Infinity; ex1 = -Infinity; ey1 = -Infinity;
    if (e.k === 'line'){ bb(v[0],v[1]); bb(v[2],v[3]); }
    else if (e.k === 'arc' || (e.k === 'solid' && e.typ >= 100)){
      // sample the swept arc: a large-radius arc must not contribute its whole circle
      var r = v[2], fl, st, en, tl;
      if (e.k === 'arc'){ st = v[3]; en = v[4]; tl = v[5]; fl = v[6] || 1; }
      else { fl = v[3] || 1; st = v[4]; en = v[5]; tl = v[6] || 0; }
      en = sweepEnd(st, en);
      var ct = Math.cos(tl || 0), stl = Math.sin(tl || 0);
      for (q = 0; q <= 16; q++){
        var a2 = st + (en - st) * q / 16;
        var ax = r * Math.cos(a2), ay = r * fl * Math.sin(a2);
        bb(v[0] + ax*ct - ay*stl, v[1] + ax*stl + ay*ct);
      }
    }
    else if (e.k === 'solid'){ for (q = 0; q < 8; q += 2) bb(v[q], v[q+1]); }
    else if (e.k === 'text'){
      var th = e.q[1] || e.q[0] || 0;
      bb(v[0], v[1] - th*0.3); bb(v[2], v[3] + th);
    }
    else if (e.k === 'point'){ bb(v[0],v[1]); }
    if (ex0 <= ex1 && isFinite(ex0) && isFinite(ey0) && isFinite(ex1) && isFinite(ey1)){
      BX0.push(ex0); BY0.push(ey0); BX1.push(ex1); BY1.push(ey1);
    }
  }

  var els = d.elements, blocks = 0;
  for (var i = 0; i < els.length; i++){
    var e = els[i];
    if (e.k === 'block'){ blocks++; continue; }
    if (e.k === 'dim'){
      place(e.line); place(e.moji);
      place(e.aux[0]); place(e.aux[1]);
      for (var j = 0; j < 4; j++) place(e.pts[j]);
      continue;
    }
    place(e);
  }
  bounds = robustBounds(BX0, BY0, BX1, BY1);

  groupOn = []; layerOn = []; hiddenInFile = 0;
  var LS = d.lstate;
  for (var g = 0; g < 16; g++){
    groupOn[g] = true;
    layerOn[g] = [];
    for (var l = 0; l < 16; l++){
      var on = LS ? LS[g][l] !== 0 : true;
      layerOn[g][l] = on;
      if (!on && layerCountRaw(g, l) > 0) hiddenInFile++;
    }
  }
  curG = 0;
  for (var g2 = 0; g2 < 16; g2++){ if (groupCount(g2) > 0){ curG = g2; break; } }

  renderPads();
  renderMeta(f, blocks);
  $('drop').classList.add('hide');
  $('btnFit').disabled = false;
  fit();
  if (d.warnings.length) showErr(d.warnings[0]);
}

function groupCount(g){
  var n = 0;
  for (var l = 0; l < 16; l++){ var b = cells[g*16+l]; if (b) n += b.n; }
  return n;
}
function layerCount(g,l){ var b = cells[g*16+l]; return b ? b.n : 0; }
function nameOf(g,l){
  if (!doc || !doc.names) return '';
  return (l === null) ? (doc.names[g*17+16] || '') : (doc.names[g*17+l] || '');
}

/* ---------- layer pads ---------- */
function pad(el, count, isVis, isSel, onTap){
  el.innerHTML = '';
  for (var i = 0; i < 16; i++){
    (function(i){
      var c = document.createElement('button');
      c.className = 'cell';
      c.textContent = HEX[i];
      var n = count(i);
      if (n > 0) c.classList.add('has'); else c.classList.add('empty');
      if (n > 0 && doc && doc.lstate && el === $('padL') && doc.lstate[curG][i] === 0) c.classList.add('off');
      if (n > 0 && isVis(i)) c.classList.add('vis');
      if (isSel && isSel(i)) c.classList.add('sel');
      c.title = n > 0 ? (n.toLocaleString('ja-JP') + ' 要素') : '要素なし';
      if (n > 0) c.addEventListener('click', function(ev){ onTap(i, ev); });
      el.appendChild(c);
    })(i);
  }
}
function renderPads(){
  pad($('padG'), groupCount, function(g){ return groupOn[g]; }, function(g){ return g === curG; },
    function(g, ev){
      if (ev.altKey || ev.metaKey){ for (var k=0;k<16;k++) groupOn[k] = (k===g); }
      else if (g === curG) groupOn[g] = !groupOn[g];
      curG = g;
      renderPads(); draw();
    });
  pad($('padL'), function(l){ return layerCount(curG,l); },
    function(l){ return layerOn[curG][l]; }, null,
    function(l, ev){
      if (ev.altKey || ev.metaKey){ for (var k=0;k<16;k++) layerOn[curG][k] = (k===l); }
      else layerOn[curG][l] = !layerOn[curG][l];
      renderPads(); draw();
    });
  var gn = nameOf(curG, null);
  $('grpTag').textContent = HEX[curG];
  $('grpName').innerHTML = gn ? ('<b>' + esc(gn) + '</b>') : '<span style="color:var(--faint)">名称なし</span>';
  $('layTag').textContent = 'グループ ' + HEX[curG];
  var parts = [];
  for (var l = 0; l < 16; l++){ if (layerCount(curG,l) > 0){ var nm = nameOf(curG,l); if (nm) parts.push(HEX[l] + ' ' + nm); } }
  $('layName').textContent = parts.join('  /  ');
}
function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;' }[c]; }); }

function renderMeta(f, blocks){
  var c = doc.counts, rows = [
    ['ファイル', (f.size/1048576).toFixed(2) + ' MB'],
    ['バージョン', 'Jw_cad ' + (doc.version/100).toFixed(2)],
    ['縮尺', doc.scale ? ('1/' + Math.round(doc.scale)) : '—'],
    ['線', (c.line||0).toLocaleString('ja-JP')],
    ['円・円弧', (c.arc||0).toLocaleString('ja-JP')],
    ['文字', (c.text||0).toLocaleString('ja-JP')],
    ['寸法', (c.dim||0).toLocaleString('ja-JP')],
    ['ソリッド', (c.solid||0).toLocaleString('ja-JP')],
    ['点', (c.point||0).toLocaleString('ja-JP')]
  ];
  if (blocks) rows.push(['ブロック', blocks.toLocaleString('ja-JP') + '（未対応）']);
  var w = Math.round(bounds.x1 - bounds.x0), h = Math.round(bounds.y1 - bounds.y0);
  rows.push(['用紙上', w.toLocaleString('ja-JP') + ' × ' + h.toLocaleString('ja-JP') + ' mm']);
  if (doc.scale > 0){
    rows.push(['実寸', (w*doc.scale/1000).toFixed(1) + ' × ' + (h*doc.scale/1000).toFixed(1) + ' m']);
  }
  if (doc.gscale){
    var uniq = [];
    for (var gi = 0; gi < 16; gi++) if (uniq.indexOf(doc.gscale[gi]) < 0) uniq.push(doc.gscale[gi]);
    if (uniq.length > 1) rows.push(['縮尺の種類', uniq.length + ' 種']);
  }
  if (hiddenInFile) rows.push(['非表示レイヤ', hiddenInFile + ' 面']);
  if (bounds.dropped) rows.push(['範囲外', bounds.dropped.toLocaleString('ja-JP') + ' 要素']);
  var html = '';
  for (var i = 0; i < rows.length; i++) html += '<dt>' + rows[i][0] + '</dt><dd>' + esc(rows[i][1]) + '</dd>';
  $('meta').innerHTML = html;
  $('ss').textContent = doc.scale ? ('1/' + Math.round(doc.scale)) : '—';
  $('sn').textContent = doc.elements.length.toLocaleString('ja-JP') + ' 要素';
}

/* ---------- view ---------- */
function fit(){
  if (!bounds) return;
  autoFit = true;
  var pad = 24;
  var w = Math.max(bounds.x1 - bounds.x0, 1e-6), h = Math.max(bounds.y1 - bounds.y0, 1e-6);
  view.s = Math.min((W - pad*2) / w, (H - pad*2) / h);
  view.tx = W/2 - (bounds.x0 + bounds.x1)/2 * view.s;
  view.ty = H/2 + (bounds.y0 + bounds.y1)/2 * view.s;
  draw();
}
function toScreen(x, y){ return [x * view.s + view.tx, -y * view.s + view.ty]; }
function toWorld(px, py){ return [(px - view.tx) / view.s, -(py - view.ty) / view.s]; }
function zoomAt(px, py, k){
  autoFit = false;
  var w = toWorld(px, py);
  view.s = Math.max(1e-5, Math.min(view.s * k, 1e5));
  view.tx = px - w[0] * view.s;
  view.ty = py + w[1] * view.s;
  draw();
}

/* ---------- draw ---------- */
function draw(){ if (!raf) raf = requestAnimationFrame(paint); }
function paint(){
  raf = 0;
  var bg = opt.dark ? '#0B0D10' : '#FFFFFF';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = doc ? bg : '#0F1115';
  ctx.fillRect(0, 0, W, H);
  if (!doc) return;

  var s = view.s;
  var v0 = toWorld(0, H), v1 = toWorld(W, 0);      // world rect: x0,y0 .. x1,y1
  var m = 8 / s;
  var vx0 = v0[0]-m, vy0 = v0[1]-m, vx1 = v1[0]+m, vy1 = v1[1]+m;

  $('sz').textContent = (s * 100 < 10 ? (s*100).toFixed(1) : Math.round(s*100)) + '%';
  var minSeg = fast ? 2.25 / (s*s) : 0;

  ctx.setTransform(dpr*s, 0, 0, -dpr*s, dpr*view.tx, dpr*view.ty);
  ctx.lineCap = 'butt'; ctx.lineJoin = 'round';

  var order = [], g, l;
  for (g = 0; g < 16; g++){
    if (!groupOn[g]) continue;
    for (l = 0; l < 16; l++){
      if (!layerOn[g][l]) continue;
      var b = cells[g*16+l];
      if (b) order.push(b);
    }
  }

  var i, k, b2, a, v, n;

  /* 1. solids */
  for (i = 0; i < order.length; i++){
    b2 = order[i];
    for (k in b2.solid){
      a = b2.solid[k];
      ctx.fillStyle = opt.color ? rgbHex(a.rgb) : (opt.dark ? '#3A4250' : '#C8CED6');
      v = a.quad;
      if (v.length){
        ctx.beginPath();
        for (n = 0; n < v.length; n += 8){
          if (Math.max(v[n],v[n+2],v[n+4],v[n+6]) < vx0 || Math.min(v[n],v[n+2],v[n+4],v[n+6]) > vx1) continue;
          if (Math.max(v[n+1],v[n+3],v[n+5],v[n+7]) < vy0 || Math.min(v[n+1],v[n+3],v[n+5],v[n+7]) > vy1) continue;
          ctx.moveTo(v[n], v[n+1]); ctx.lineTo(v[n+2], v[n+3]);
          ctx.lineTo(v[n+4], v[n+5]); ctx.lineTo(v[n+6], v[n+7]); ctx.closePath();
        }
        ctx.fill();
      }
      v = a.disc;
      if (v.length){
        ctx.beginPath();
        for (n = 0; n < v.length; n += 7){
          var r = v[n+2];
          if (v[n]+r < vx0 || v[n]-r > vx1 || v[n+1]+r < vy0 || v[n+1]-r > vy1) continue;
          var ry = r * (v[n+3] || 1), sa = v[n+4], ea = v[n+5];
          ctx.moveTo(v[n], v[n+1]);
          ctx.ellipse(v[n], v[n+1], r, ry, v[n+6] || 0, sa, sweepEnd(sa, ea));
          ctx.closePath();
        }
        ctx.fill();
      }
    }
  }

  /* 2. lines + arcs */
  for (i = 0; i < order.length; i++){
    b2 = order[i];
    for (k in b2.line){
      a = b2.line[k]; v = a.v;
      applyPen(a, s);
      ctx.beginPath();
      for (n = 0; n < v.length; n += 4){
        if (v[n] < vx0 && v[n+2] < vx0) continue;
        if (v[n] > vx1 && v[n+2] > vx1) continue;
        if (v[n+1] < vy0 && v[n+3] < vy0) continue;
        if (v[n+1] > vy1 && v[n+3] > vy1) continue;
        if (minSeg){ var ddx = v[n+2]-v[n], ddy = v[n+3]-v[n+1]; if (ddx*ddx + ddy*ddy < minSeg) continue; }
        ctx.moveTo(v[n], v[n+1]); ctx.lineTo(v[n+2], v[n+3]);
      }
      ctx.stroke();
    }
    for (k in b2.arc){
      a = b2.arc[k]; v = a.v;
      applyPen(a, s);
      ctx.beginPath();
      for (n = 0; n < v.length; n += 7){
        var rr = v[n+2], fl = v[n+6] || 1;
        if (v[n]+rr < vx0 || v[n]-rr > vx1 || v[n+1]+rr < vy0 || v[n+1]-rr > vy1) continue;
        if (rr * s < 0.35) continue;
        var st = v[n+3], en = sweepEnd(st, v[n+4]);
        ctx.ellipse(v[n], v[n+1], rr, rr*fl, v[n+5] || 0, st, en);
      }
      ctx.stroke();
    }
  }

  /* 3. points */
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  for (i = 0; i < order.length; i++){
    v = order[i].point;
    for (n = 0; n < v.length; n += 3){
      if (v[n] < vx0 || v[n] > vx1 || v[n+1] < vy0 || v[n+1] > vy1) continue;
      var p = toScreen(v[n], v[n+1]);
      ctx.fillStyle = opt.color ? penColor(v[n+2], opt.dark) : (opt.dark ? '#8894A4' : '#6A7482');
      ctx.fillRect(p[0]-1, p[1]-1, 2, 2);
    }
  }

  /* 4. text (screen space, so glyphs never mirror) */
  if (opt.text && !(fast && order.length > 6)){
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    for (i = 0; i < order.length; i++){
      var T = order[i].text;
      for (n = 0; n < T.length; n++) drawText(T[n], s, vx0, vy0, vx1, vy1);
    }
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

function applyPen(a, s){
  ctx.strokeStyle = opt.color ? penColor(a.col, opt.dark) : (opt.dark ? '#DDE3EB' : '#111417');
  var px = 1;
  if (opt.width && a.wid > 0) px = Math.max(0.6, a.wid / 100 * 3.2);
  ctx.lineWidth = px / s;
  var d = dashOf(a.typ);
  if (d){
    var q = new Array(d.length);
    for (var i = 0; i < d.length; i++) q[i] = d[i] / s;
    ctx.setLineDash(q);
  } else ctx.setLineDash([]);
}
function rgbHex(v){
  var r = v & 255, g = (v >> 8) & 255, b = (v >> 16) & 255;
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function drawText(t, s, vx0, vy0, vx1, vy1){
  var v = t.v, hgt = t.q[1] || t.q[0] || 2;
  var ph = hgt * s;
  if (ph < 3.5) return;
  var x0 = Math.min(v[0], v[2]), x1 = Math.max(v[0], v[2]);
  var y0 = Math.min(v[1], v[3]), y1 = Math.max(v[1], v[3]);
  if (x1 + hgt < vx0 || x0 - hgt > vx1 || y1 + hgt < vy0 || y0 - hgt > vy1) return;
  var str = t.txt;
  if (!str) return;

  var p = toScreen(v[0], v[1]);
  var ang = Math.atan2(v[3] - v[1], v[2] - v[0]);
  var runW = Math.hypot(v[2]-v[0], v[3]-v[1]) * s;

  ctx.save();
  ctx.translate(p[0], p[1]);
  ctx.rotate(-ang);
  ctx.font = ph.toFixed(2) + 'px ' + fontFamily(t.font);
  ctx.fillStyle = opt.color ? penColor(t.col, opt.dark) : (opt.dark ? '#DDE3EB' : '#111417');
  if (runW > 1){
    var mw = ctx.measureText(str).width;
    if (mw > 0.5) ctx.scale(runW / mw, 1);
  }
  ctx.fillText(str, 0, 0);
  ctx.restore();
}

/* ---------- pointer interaction ---------- */
var pts = {}, last = null, pinch = null;
cv.addEventListener('pointerdown', function(e){
  if (!doc) return;
  cv.setPointerCapture(e.pointerId);
  pts[e.pointerId] = { x:e.clientX, y:e.clientY };
  var ids = Object.keys(pts);
  if (ids.length === 1) last = { x:e.clientX, y:e.clientY };
  else if (ids.length === 2) pinch = span(ids);
});
cv.addEventListener('pointermove', function(e){
  var r = cv.getBoundingClientRect();
  if (doc && !Object.keys(pts).length){
    var w = toWorld(e.clientX - r.left, e.clientY - r.top);
    $('sx').textContent = w[0].toFixed(1);
    $('sy').textContent = w[1].toFixed(1);
  }
  if (!pts[e.pointerId]) return;
  pts[e.pointerId] = { x:e.clientX, y:e.clientY };
  var ids = Object.keys(pts);
  if (ids.length === 1 && last){
    touchNow(); autoFit = false;
    view.tx += e.clientX - last.x; view.ty += e.clientY - last.y;
    last = { x:e.clientX, y:e.clientY };
    draw();
  } else if (ids.length === 2 && pinch){
    var now = span(ids);
    var k = now.d / (pinch.d || 1);
    view.tx += now.cx - pinch.cx; view.ty += now.cy - pinch.cy;
    zoomAt(now.cx - r.left, now.cy - r.top, k);
    pinch = now;
  }
});
function span(ids){
  var a = pts[ids[0]], b = pts[ids[1]];
  return { d:Math.hypot(a.x-b.x, a.y-b.y), cx:(a.x+b.x)/2, cy:(a.y+b.y)/2 };
}
function up(e){
  delete pts[e.pointerId];
  var ids = Object.keys(pts);
  if (ids.length < 2) pinch = null;
  if (ids.length === 1) last = { x:pts[ids[0]].x, y:pts[ids[0]].y };
  if (!ids.length) last = null;
}
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', function(e){
  if (!doc) return;
  e.preventDefault();
  var r = cv.getBoundingClientRect();
  touchNow();
  var k = Math.pow(0.999, e.deltaY * (e.deltaMode === 1 ? 18 : 1));
  zoomAt(e.clientX - r.left, e.clientY - r.top, k);
}, { passive:false });
cv.addEventListener('dblclick', function(e){
  if (!doc) return;
  var r = cv.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, 1.9);
});

/* ---------- ui wiring ---------- */
function pickFile(){ $('file').click(); }
$('btnOpen').addEventListener('click', pickFile);
$('btnOpen2').addEventListener('click', pickFile);
$('file').addEventListener('change', function(){ openFile(this.files[0]); this.value = ''; });
$('btnFit').addEventListener('click', fit);

var stage = $('stage');
['dragenter','dragover'].forEach(function(t){
  stage.addEventListener(t, function(e){ e.preventDefault(); $('drop').classList.add('over'); });
});
['dragleave','drop'].forEach(function(t){
  stage.addEventListener(t, function(e){ e.preventDefault(); $('drop').classList.remove('over'); });
});
stage.addEventListener('drop', function(e){
  var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) openFile(f);
});

document.querySelectorAll('[data-all]').forEach(function(b){
  b.addEventListener('click', function(){
    var m = b.getAttribute('data-all'), on = m.charAt(1) === '1', i;
    if (m.charAt(0) === 'g'){ for (i = 0; i < 16; i++) groupOn[i] = on; }
    else { for (i = 0; i < 16; i++) layerOn[curG][i] = on; }
    renderPads(); draw();
  });
});

function bindOpt(id, key){
  $(id).addEventListener('change', function(){ opt[key] = this.checked; draw(); });
}
bindOpt('optText','text'); bindOpt('optColor','color');
bindOpt('optWidth','width'); bindOpt('optDark','dark');

$('btnPng').addEventListener('click', function(){
  if (!doc) return;
  cv.toBlob(function(b){
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = ($('fname').textContent || 'drawing').replace(/\.jww$/i,'') + '.png';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  }, 'image/png');
});

var rail = $('rail'), scrim = $('scrim');
function toggleRail(){ rail.classList.toggle('open'); scrim.classList.toggle('on', rail.classList.contains('open')); }
$('railToggle').addEventListener('click', toggleRail);
scrim.addEventListener('click', toggleRail);

document.addEventListener('keydown', function(e){
  if (!doc) return;
  if (e.key === 'f' || e.key === 'F') fit();
  if (e.key === '+' || e.key === '=') zoomAt(W/2, H/2, 1.3);
  if (e.key === '-' || e.key === '_') zoomAt(W/2, H/2, 1/1.3);
});

resize();
})();
</script>
